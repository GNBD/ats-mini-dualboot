<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boot Manager Flasher — GNBD</title>
<style>
  :root{
    --bg:#ffffff; --fg:#0a0a0a; --mut:#737373; --card:#ffffff; --line:#e5e5e5;
    --chip:#f5f5f5; --accent:#111111; --accent-fg:#ffffff;
    --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);
    --glow:0 0 0 rgba(0,0,0,0);
  }
  html[data-theme="dark"]{
    --bg:#000000; --fg:#fafafa; --mut:#a3a3a3; --card:#0a0a0a; --line:#262626;
    --chip:#141414; --accent:#ffffff; --accent-fg:#000000;
    --shadow:0 1px 2px rgba(255,255,255,.04),0 8px 30px rgba(255,255,255,.05);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  /* animated monochrome background */
  .bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background:
      radial-gradient(60% 50% at 15% 10%, var(--chip), transparent 60%),
      radial-gradient(50% 60% at 90% 90%, var(--chip), transparent 60%);
    animation:drift 18s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(0,-14px,0) scale(1.04)}}
  .wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:26px 18px 80px}

  header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:12px}
  @keyframes spin3{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
  h1{font-size:19px;margin:0;letter-spacing:-.02em}
  .sub{color:var(--mut);font-size:12.5px;margin:2px 0 0}
  .top{display:flex;gap:8px;align-items:center}
  .langs{display:flex;gap:3px;background:var(--chip);border:1px solid var(--line);border-radius:11px;padding:3px}
  .langs button{background:none;color:var(--mut);border:0;border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer;transition:.2s}
  .langs button.on{background:var(--accent);color:var(--accent-fg)}
  .iconbtn{background:var(--card);border:1px solid var(--line);border-radius:11px;width:38px;height:38px;
    font-size:16px;cursor:pointer;color:var(--fg);transition:.2s}
  .iconbtn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}

  /* progress rail */
  .rail{display:flex;align-items:flex-start;justify-content:space-between;position:relative;margin:8px 4px 26px}
  .rail::before{content:"";position:absolute;left:10px;right:10px;top:15px;height:2px;background:var(--line)}
  .prog{position:absolute;left:10px;top:15px;height:2px;background:var(--accent);width:0;transition:width .5s cubic-bezier(.2,.7,.2,1)}
  .node{position:relative;z-index:1;flex:1;text-align:center;color:var(--mut);font-size:11.5px}
  .node .dot{display:grid;place-items:center;width:32px;height:32px;margin:0 auto 6px;border-radius:50%;
    background:var(--card);border:2px solid var(--line);font-weight:700;font-size:13px;transition:.35s}
  .node.on{color:var(--fg)}
  .node.on .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);
    transform:scale(1.08);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 14%,transparent)}
  .node.done .dot{background:var(--fg);border-color:var(--fg);color:var(--bg)}
  .node.done .dot::after{content:"✓"}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;
    box-shadow:var(--shadow);animation:fadeUp .5s cubic-bezier(.2,.7,.2,1) both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  h2{font-size:17px;margin:0 0 4px;letter-spacing:-.02em}
  h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin:20px 0 8px}
  p,li{font-size:14px}
  .note{color:var(--mut);font-size:13px;margin:4px 0}
  .step{display:none}
  .step.on{display:block}

  .hero{text-align:center;padding:10px 0 6px}
  .hero .big{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0 0 6px}
  .connect{width:120px;height:120px;margin:16px auto;border-radius:50%;border:2px dashed var(--line);
    display:grid;place-items:center;background:var(--chip);transition:.3s}
  .connect.ok{border-style:solid;border-color:var(--fg);animation:pop .4s}
  .connect.busy{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--fg) 20%,transparent)}50%{box-shadow:0 0 0 14px transparent}}
  .connect .glyph{font-size:34px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border:1.5px solid var(--accent);
    border-radius:12px;background:var(--accent);color:var(--accent-fg);font-size:14.5px;font-weight:700;cursor:pointer;
    transition:transform .15s ease,box-shadow .2s,opacity .2s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 18%,transparent)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
  .btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
  .btn.ghost:hover{box-shadow:none;border-color:var(--fg)}
  .btn.sm{padding:9px 15px;font-size:13px}
  .btn.wide{width:100%}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
  .row.right{justify-content:flex-end}

  input[type=file],input[type=text],select{background:var(--bg);color:var(--fg);
    border:1.5px solid var(--line);border-radius:12px;padding:11px;width:100%;margin:7px 0;font-size:14px;transition:.2s}
  input:focus,select:focus{outline:none;border-color:var(--fg);box-shadow:0 0 0 3px color-mix(in srgb,var(--fg) 12%,transparent)}
  .chk{display:flex;gap:11px;align-items:flex-start;font-size:13.5px;margin:11px 0;cursor:pointer;transition:.2s}
  .chk input{width:auto;margin:3px 0 0;accent-color:var(--accent)}

  .bar{height:9px;background:var(--chip);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:16px 0 8px}
  .fill{height:100%;width:0%;border-radius:999px;background:var(--accent);position:relative;transition:width .2s}
  .fill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,
    color-mix(in srgb,var(--accent-fg) 22%,transparent) 0 8px,transparent 8px 16px);animation:shim 1s linear infinite}
  @keyframes shim{from{background-position:0 0}to{background-position:32px 0}}
  #status{font-size:13px;color:var(--mut);min-height:1.4em}
  .term{background:var(--chip);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .term .bar3{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .term .bar3 i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
  #log{margin:0;padding:12px;height:190px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    font-size:12px;white-space:pre-wrap;color:var(--mut)}
  #log::after{content:"▋";color:var(--fg);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  #licbox{background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:12px;height:150px;
    overflow:auto;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;white-space:pre-wrap;color:var(--mut);margin:0}
  a{color:var(--fg)}
  footer{margin-top:24px;text-align:center;color:var(--mut);font-size:12.5px;
    border-top:1px solid var(--line);padding-top:14px}

  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;
    align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
  html[data-theme="dark"] .modal{background:rgba(0,0,0,.7)}
  .modal.on{display:flex}
  .mbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:410px;width:100%;
    box-shadow:0 24px 60px rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.2,.7,.2,1)}
  .spin{width:16px;height:16px;border:2px solid var(--mut);border-top-color:var(--accent);border-radius:50%;
    display:inline-block;animation:spin3 .8s linear infinite;vertical-align:-3px}

  /* 3D silver chip */
  .scene{perspective:820px;height:170px;margin:6px auto;display:grid;place-items:center;
    filter:drop-shadow(0 14px 30px color-mix(in srgb,var(--fg) 22%,transparent))}
  .chip3d{position:relative;width:120px;height:120px;transform-style:preserve-3d;animation:spin3d 9s linear infinite}
  @keyframes spin3d{from{transform:rotateX(-16deg) rotateY(0)}to{transform:rotateX(-16deg) rotateY(360deg)}}
  .chip3d .cfront,.chip3d .cback{position:absolute;left:50%;top:50%;width:120px;height:120px;border-radius:12px;
    border:1px solid #9a9a9a}
  .chip3d .cfront{transform:translate(-50%,-50%) translateZ(9px);
    background:linear-gradient(150deg,#f4f4f4,#c6c6c6 60%,#aaaaaa);color:#141414;
    box-shadow:inset 0 1px 0 #fff,inset 0 -3px 8px rgba(0,0,0,.22);
    display:grid;place-items:center;padding:12px;text-align:center}
  .chip3d .cback{transform:translate(-50%,-50%) rotateY(180deg) translateZ(9px);
    background:linear-gradient(150deg,#d2d2d2,#9c9c9c)}
  .chip3d .cside{position:absolute;left:50%;top:50%;border:1px solid #5a5a5a;
    background:repeating-linear-gradient(180deg,#5f5f5f 0 3px,#3d3d3d 3px 6px)}
  .chip3d .cside.r{width:18px;height:120px;transform:translate(-50%,-50%) rotateY(90deg) translateZ(60px)}
  .chip3d .cside.l{width:18px;height:120px;transform:translate(-50%,-50%) rotateY(-90deg) translateZ(60px)}
  .chip3d .cside.t{width:120px;height:18px;background:repeating-linear-gradient(90deg,#5f5f5f 0 3px,#3d3d3d 3px 6px);
    transform:translate(-50%,-50%) rotateX(90deg) translateZ(60px)}
  .chip3d .cside.b{width:120px;height:18px;background:repeating-linear-gradient(90deg,#5f5f5f 0 3px,#3d3d3d 3px 6px);
    transform:translate(-50%,-50%) rotateX(-90deg) translateZ(60px)}
  .chip3d .ctext b{display:block;font-size:15px;letter-spacing:-.02em;line-height:1.1}
  .chip3d .ctext span{display:block;margin-top:5px;font-size:8px;font-weight:600;color:#333;line-height:1.3}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
  @media(max-width:560px){.split{grid-template-columns:1fr}}
  .pane{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--chip)}
  .paneh{font-weight:700;font-size:13.5px;margin-bottom:6px}
  .opt{color:var(--mut);font-weight:500;font-size:11px}
  .picked{font-size:11.5px;color:var(--mut);min-height:1em;word-break:break-all;margin-top:2px}
</style>
<script>(function(){try{var t=localStorage.getItem("ats-theme");if(!t)t="light";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<div class="bgfx"></div>
<div class="wrap">
  <header>
    <div class="brand">
      <div><h1 data-i18n="title"></h1><p class="sub" data-i18n="sub"></p></div>
    </div>
    <div class="top">
      <div class="langs" id="langs">
        <button data-lang="en">English</button>
        <button data-lang="ru">Русский</button>
        <button data-lang="ko">한국어</button>
      </div>
      <button class="iconbtn" id="theme" aria-label="Theme">◐</button>
    </div>
  </header>

  <div class="rail">
    <div class="prog" id="prog"></div>
    <div class="node on" data-n="1"><span class="dot">1</span><span data-i18n="st1"></span></div>
    <div class="node" data-n="2"><span class="dot">2</span><span data-i18n="st2"></span></div>
    <div class="node" data-n="3"><span class="dot">3</span><span data-i18n="st3"></span></div>
    <div class="node" data-n="4"><span class="dot">4</span><span data-i18n="st4"></span></div>
  </div>

  <section class="step on" data-step="1">
    <div class="card">
      <div class="hero">
        <p class="big" data-i18n="s1_h"></p>
        <p class="note" data-i18n="s1_p"></p>
        <div class="connect" id="conn"><span class="glyph">⌁</span></div>
        <div class="scene" id="board3d" style="display:none">
          <div class="chip3d">
            <div class="cfront"><div class="ctext" id="chiptext"><b>ESP32-S3</b></div></div>
            <div class="cback"></div>
            <div class="cside r"></div><div class="cside l"></div>
            <div class="cside t"></div><div class="cside b"></div>
          </div>
        </div>
        <button class="btn" id="select" data-i18n="select"></button>
      </div>
      <div id="chipinfo" class="note" style="text-align:center"></div>
      <div class="row right"><button class="btn ghost" id="next1" disabled data-i18n="next"></button></div>
    </div>
  </section>

  <section class="step" data-step="2">
    <div class="card">
      <h2 data-i18n="s2_h"></h2>
      <p class="note" data-i18n="s2_p"></p>
      <div class="row">
        <button class="btn" id="yes2" data-i18n="yes"></button>
        <button class="btn ghost" id="no2" data-i18n="no"></button>
      </div>
      <div id="fwbox" style="display:none" class="split">
        <div class="pane">
          <div class="paneh">App0</div>
          <input type="file" id="app0file" accept=".bin">
          <input type="text" id="app0url" data-i18n-ph="urlph">
          <div class="picked" id="app0info"></div>
        </div>
        <div class="pane">
          <div class="paneh">App1 <span class="opt" data-i18n="optional"></span></div>
          <input type="file" id="app1file" accept=".bin">
          <input type="text" id="app1url" data-i18n-ph="urlph">
          <div class="picked" id="app1info"></div>
        </div>
      </div>
      <div class="row right">
        <button class="btn ghost" id="back2" data-i18n="back"></button>
        <button class="btn" id="next2" data-i18n="next"></button>
      </div>
    </div>
  </section>

  <section class="step" data-step="3">
    <div class="card">
      <h2 data-i18n="s3_h"></h2>
      <p class="note" data-i18n="s3_p"></p>
      <h3 data-i18n="warn_h"></h3>
      <ul>
        <li data-i18n="warn_1"></li>
        <li data-i18n="warn_2"></li>
        <li data-i18n="warn_3"></li>
      </ul>
      <h3 data-i18n="lic_h"></h3>
      <pre id="licbox"></pre>
      <label class="chk"><input type="checkbox" id="ag1"><span data-i18n="agree1"></span></label>
      <label class="chk"><input type="checkbox" id="ag2"><span data-i18n="agree2"></span></label>
      <div class="row right">
        <button class="btn ghost" id="back3" data-i18n="back"></button>
        <button class="btn" id="next3" disabled data-i18n="next"></button>
      </div>
    </div>
  </section>

  <section class="step" data-step="4">
    <div class="card">
      <h2 data-i18n="s4_h"></h2>
      <p class="note" data-i18n="s4_p"></p>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div id="status"></div>
      <div class="row">
        <button class="btn ghost" id="back4" data-i18n="back"></button>
        <button class="btn" id="flash" data-i18n="flash"></button>
      </div>
      <label class="chk"><input type="checkbox" id="erase"><span data-i18n="erase_chk"></span></label>
      <p class="note" data-i18n="erase_hint"></p>
      <h3 data-i18n="term_h"></h3>
      <div class="term">
        <div class="bar3"><i></i><i></i><i></i></div>
        <pre id="log"></pre>
      </div>
    </div>
  </section>

  <footer><span data-i18n="supports"></span><br>by GNBD · <a href="https://github.com/GNBD/ats-mini-dualboot" target="_blank" rel="noopener">github.com/GNBD/ats-mini-dualboot</a></footer>
</div>

<div class="modal" id="modal"><div class="mbox">
  <h3 id="m_h" style="color:var(--fg);margin-top:0;font-size:16px;text-transform:none;letter-spacing:-.01em"></h3>
  <p id="m_p" class="note"></p>
  <div class="row right">
    <button class="btn ghost" id="m_no" data-i18n="cf_no"></button>
    <button class="btn" id="m_yes" data-i18n="cf_yes"></button>
  </div>
</div></div>

let lang="en";
const T=k=>(I18N[lang]&&I18N[lang][k])||I18N.en[k]||k;
const $=id=>document.getElementById(id);
function setLang(l){
  if(!I18N[l]) l="en"; lang=l; document.documentElement.lang=l;
  document.querySelectorAll("[data-i18n]").forEach(el=>{const v=I18N[l][el.getAttribute("data-i18n")];if(v!==undefined)el.textContent=v;});
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{const v=I18N[l][el.getAttribute("data-i18n-ph")];if(v!==undefined)el.placeholder=v;});
  document.querySelectorAll("#langs button").forEach(b=>b.classList.toggle("on",b.dataset.lang===l));
  try{localStorage.setItem("ats-inst-lang",l);}catch(e){}
}
document.querySelectorAll("#langs button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));

const logEl=$("log"), st=$("status"), fill=$("fill");
const log=s=>{logEl.textContent+=s+"\n";logEl.scrollTop=logEl.scrollHeight;};
const bar=p=>{fill.style.width=Math.max(0,Math.min(100,p))+"%";};
const status=s=>{st.textContent=s;};

function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  const b=$("theme"); if(b) b.textContent=(t==="dark")?"☀":"☾";
  try{localStorage.setItem("ats-theme",t);}catch(e){}
}
$("theme").onclick=()=>applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");
applyTheme(document.documentElement.getAttribute("data-theme")||"light");

function show(n){
  document.querySelectorAll(".step").forEach(s=>s.classList.toggle("on",+s.dataset.step===n));
  document.querySelectorAll(".node").forEach(nd=>{
    const k=+nd.dataset.n;
    nd.classList.toggle("on",k===n); nd.classList.toggle("done",k<n);
    nd.querySelector(".dot").textContent = k<n ? "" : String(k);
  });
  $("prog").style.width=((n-1)/3*100)+"%";
  if(n===3) loadLicense();
  window.scrollTo({top:0,behavior:"smooth"});
}

const NEED=[
  {name:"ats-mini-bootloader-v4.bin", local:"firmware/ats-mini-bootloader-v4.bin", addr:0x0},
  {name:"ats-mini-partitions-v4.bin", local:"firmware/ats-mini-partitions-v4.bin", addr:0x8000},
  {name:"ats-mini-recovery-4.1.0.bin", local:"firmware/ats-mini-recovery-4.1.0.bin", addr:0x860000},
];

// A merged (full) image carries a partition table at 0x8000; extract just the
// first app image from it so it can go into a slot, exactly like the firmware.
function findFirstAppOffset(d){
  if(d.length < 0x8000+32) return 0;
  for(let i=0;i<95;i++){
    const o=0x8000+i*32;
    if(o+32>d.length) break;
    if(d[o]!==0xAA || d[o+1]!==0x50) break;
    const type=d[o+2], sub=d[o+3];
    const addr=d[o+4]|(d[o+5]<<8)|(d[o+6]<<16)|(d[o+7]<<24);
    if(type===0 && sub>=0x10 && sub<=0x1F) return addr;
  }
  return 0;
}
function computeAppImageSize(d, off){
  if(off+24 > d.length || d[off]!==0xE9) return 0;
  const seg=d[off+1];
  let pos=24;
  for(let i=0;i<seg;i++){
    if(off+pos+8 > d.length) return 0;
    const dlen=d[off+pos+4]|(d[off+pos+5]<<8)|(d[off+pos+6]<<16)|(d[off+pos+7]<<24);
    pos += 8 + dlen;
    if(off+pos > d.length) return 0;
  }
  pos += 1; if(pos%16) pos += 16-(pos%16);
  if(d[off+23]===1) pos += 32;
  return pos;
}
function extractAppImage(raw){
  if(raw.length > 0x8002 && raw[0]===0xE9 && raw[0x8000]===0xAA && raw[0x8001]===0x50){
    const off=findFirstAppOffset(raw);
    const sz=off?computeAppImageSize(raw,off):0;
    if(off && sz && sz<=raw.length) return {data:raw.slice(off,off+sz), merged:true};
  }
  return {data:raw, merged:false};
}
let transport=null, loader=null, busy=false, useApp=false, licLoaded=false;

async function connect(){
  if(loader) return loader;
  if(!navigator.serial) throw new Error(T("notserial"));
  status(T("connecting")); $("conn").classList.add("busy");
  const port=await navigator.serial.requestPort();
  transport=new Transport(port,true);
  loader=new ESPLoader({transport,baudrate:460800,
    terminal:{clean(){logEl.textContent="";},writeLine(d){log(d);},write(d){logEl.textContent+=d;}}});
  const chip=await loader.main();
  $("conn").classList.remove("busy");
  $("conn").style.display="none";
  $("board3d").style.display="grid";
  const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const i=chip.indexOf("(");
  $("chiptext").innerHTML = i>0
    ? "<b>"+esc(chip.slice(0,i).trim())+"</b><span>"+esc(chip.slice(i).trim())+"</span>"
    : "<b>"+esc(chip.trim())+"</b>";
  $("chipinfo").textContent="";
  log(T("chip")+": "+chip);
  return loader;
}

async function loadLicense(){
  if(licLoaded) return; licLoaded=true;
  const box=$("licbox"); box.textContent="…";
  const srcs=[
    ["https://raw.githubusercontent.com/GNBD/ats-mini-dualboot/main/LICENSE",
     "https://raw.githubusercontent.com/GNBD/ats-mini-dualboot/main/NOTICE"],
    ["licenses/LICENSE.txt","licenses/NOTICE.txt"]
  ];
  for(const [a,b] of srcs){
    try{ const ra=await fetch(a), rb=await fetch(b);
      if(ra.ok && rb.ok){ box.textContent=(await ra.text())+"\n\n================ NOTICE ================\n\n"+(await rb.text()); return; }
    }catch(e){}
  }
  box.textContent=T("lic_fail");
}

async function runFlash(){
  busy=true; $("flash").disabled=true;
  try{
    await connect();
    status(T("fetching"));
    const fa=[];
    for(const n of NEED){
      const r=await fetch(n.local); if(!r.ok) throw new Error("missing "+n.local);
      const data=new Uint8Array(await r.arrayBuffer());
      fa.push({data, address:n.addr});
      log(n.name+"  "+data.length+" B  @ 0x"+n.addr.toString(16));
    }
    if(useApp){
      for(const [id,addr,nm] of [["app0",0x10000,"App0"],["app1",0x390000,"App1"]]){
        const url=($(id+"url").value||"").trim(), file=$(id+"file").files[0];
        if(!url && !file) continue;
        let raw,fn;
        if(url){ const r=await fetch(url); if(!r.ok) throw new Error("HTTP "+r.status);
          raw=new Uint8Array(await r.arrayBuffer()); fn=url.split("/").pop()||url; }
        else { raw=new Uint8Array(await file.arrayBuffer()); fn=file.name; }
        const ex=extractAppImage(raw);
        if(ex.merged) log(nm+": merged image -> app only ("+raw.length+" -> "+ex.data.length+" B)");
        fa.push({data:ex.data, address:addr});
        log(nm+" "+fn+"  "+ex.data.length+" B  @ 0x"+addr.toString(16));
      }
    }
    const total=fa.reduce((s,f)=>s+f.data.length,0);
    let acc=0; const base=[]; for(const f of fa){ base.push(acc); acc+=f.data.length; }
    status(T("writing"));
    await loader.writeFlash({
      fileArray:fa, flashMode:"keep", flashFreq:"keep", flashSize:"keep",
      eraseAll:$("erase").checked, compress:true,
      reportProgress:(i,w)=>{ const p=Math.round((base[i]+w)/total*100); bar(p); status(T("writing")+" "+p+"%"); }
    });
    await loader.after("hard_reset");
    bar(100); status(T("done")); log(T("done"));
  }catch(e){ status(T("err")+": "+e.message); log("ERROR: "+e.message); }
  finally{ busy=false; $("flash").disabled=false; }
}

function confirmThen(){
  $("m_h").textContent = $("erase").checked ? "⚠ "+T("flash") : T("flash");
  $("m_p").textContent = $("erase").checked ? T("cf_erase") : T("cf_p");
  $("modal").classList.add("on");
}
function closeModal(){ $("modal").classList.remove("on"); }

$("select").onclick=async()=>{ try{ await connect(); $("next1").disabled=false; } catch(e){ status(T("err")+": "+e.message); } };
$("next1").onclick=()=>show(2);
$("back2").onclick=()=>show(1);
$("yes2").onclick=()=>{ useApp=true; $("fwbox").style.display="block"; };
$("no2").onclick=()=>{ useApp=false; $("fwbox").style.display="none"; show(3); };
$("next2").onclick=()=>{
  if(useApp){
    const any=$("app0url").value.trim()||$("app0file").files[0]||$("app1url").value.trim()||$("app1file").files[0];
    if(!any){ status(T("pickfile")); return; }
  }
  show(3);
};
["app0","app1"].forEach(id=>{
  $(id+"file").onchange=()=>{ const f=$(id+"file").files[0]; $(id+"info").textContent=f?f.name:""; };
});
$("back3").onclick=()=>show(2);
const chk=()=>{ $("next3").disabled=!($("ag1").checked && $("ag2").checked); };
$("ag1").onchange=chk; $("ag2").onchange=chk;
$("next3").onclick=()=>show(4);
$("back4").onclick=()=>show(3);
$("flash").onclick=confirmThen;
$("m_no").onclick=closeModal;
$("m_yes").onclick=()=>{ closeModal(); runFlash(); };

(function(){
  let l=null; try{l=localStorage.getItem("ats-inst-lang");}catch(e){}
  if(!l){ const n=(navigator.language||"en").slice(0,2).toLowerCase();
    l=(n==="ru")?"ru":(n==="ko")?"ko":"en"; }
  setLang(l); show(1);
  if(!navigator.serial){ status(T("notserial")); $("select").disabled=true; }
})();
</script>
